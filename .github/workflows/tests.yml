
name: Testes e cobertura - Sistema Solidario

on:
  push:
    branches:
      - main
      - review/melhorias-seguranca-estoque
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Pytest e cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Executar testes e medir cobertura
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: coverage.xml
          if-no-files-found: ignore
